modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
displayTest = "IGNORE_ALL_VERSION"
description = '''${mod_description}'''

[[mixins]]
config = "jei_tag_groups.mixins.json"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"

[[dependencies."${mod_id}"]]
modId = "forge"
mandatory = true
versionRange = "${forge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "jei"
mandatory = true
versionRange = "${jei_version_range}"
ordering = "AFTER"
side = "CLIENT"
